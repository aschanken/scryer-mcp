[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scryer-mcp"
version = "0.1.0"
description = "Local scryer search MCP server — DDG + content extraction + optional LLM synthesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "ddgs",
    "httpx>=0.27",
    "trafilatura",
    "beautifulsoup4",
    "lxml",
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.scripts]
scryer-mcp = "scryer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requires network access)",
]
